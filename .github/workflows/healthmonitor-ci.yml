
# HealthMonitor Continuous Integration
#
# Purpose:
# Provide reproducible backend builds and automated testing
# for contributors and technical reviewers.
#
# Developers do not need PostgreSQL or Docker installed locally
# to build the application and run unit tests.
#
# CI provisions a disposable PostgreSQL service, validates
# its identity, and applies the existing EF Core migrations.
#
# PostgreSQL integration testing covers receipts, Device queries,
# and committed catalog provisioning in the disposable service.
#
# TRX method and theory inventories reject missing or skipped verification.
#
# Security principles:
# - Never connect to development or production Supabase.
# - Use a dedicated, disposable PostgreSQL database.
# - Require explicit authorization for database testing.
# - Restrict workflow permissions to repository read access.
# - Stop processing immediately when database setup fails.

name: HealthMonitor CI

on:
  push:
  pull_request:

# The workflow does not modify repository contents,
# publish packages, or deploy application resources.
# Therefore, read-only repository permissions are sufficient.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    # GitHub Actions creates a dedicated PostgreSQL container
    # for this job and disposes of it when the job completes.
    #
    # This keeps integration testing independent of Supabase
    # and eliminates the need for contributors to configure
    # their own database when submitting pull requests.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: healthmonitor_test
          POSTGRES_USER: healthmonitor_test_user
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U healthmonitor_test_user -d healthmonitor_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # These environment variables match the existing
      # PostgreSqlTestFixture and database configuration.
      #
      # Integration testing requires explicit authorization,
      # an exact test database name, and a localhost connection.
      #
      # This connection string is for the disposable CI database
      # only. No production credentials are required.
      HEALTHMONITOR_ENABLE_DB_TESTS: "true"

      ConnectionStrings__HealthMonitorIntegrationTest: "Host=127.0.0.1;Port=5432;Database=healthmonitor_test;Username=healthmonitor_test_user;Password=ci_test_password"

      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Restore C# projects individually rather than building
      # the complete HealthMonitor.slnx solution.
      #
      # The solution contains a Visual Studio JavaScript
      # project (.esproj); frontend checks run in the independent
      # Node.js/npm job below.
      #
      # Separating these builds avoids introducing frontend
      # tooling requirements into backend validation.
      - name: Restore backend and test projects
        run: |
          dotnet restore src/backend/HealthMonitor.Api/HealthMonitor.Api.csproj
          dotnet restore tests/HealthMonitor.UnitTests/HealthMonitor.UnitTests.csproj
          dotnet restore tests/HealthMonitor.IntegrationTests/HealthMonitor.IntegrationTests.csproj

      - name: Build backend
        run: |
          dotnet build \
            src/backend/HealthMonitor.Api/HealthMonitor.Api.csproj \
            --configuration Release \
            --no-restore

      # Unit tests run without a database connection.
      #
      # A PostgreSQL service failure must not change the
      # meaning of unit-test assertions.
      - name: Run unit tests
        run: |
          dotnet test \
            tests/HealthMonitor.UnitTests/HealthMonitor.UnitTests.csproj \
            --configuration Release \
            --no-restore \
            --logger "trx;LogFileName=unit.trx" \
            --results-directory artifacts/test-results/unit

      - name: Build integration-test project
        run: |
          dotnet build \
            tests/HealthMonitor.IntegrationTests/HealthMonitor.IntegrationTests.csproj \
            --configuration Release \
            --no-restore

      # Restore the repository-pinned EF Core CLI.
      #
      # The tool version is defined in the committed
      # dotnet-tools.json manifest at the repository root.
      #
      # This ensures contributors and CI use the same
      # EF Core tooling version without global installation.
      # Database-free HTTP feature tests use explicit fake ports and never start Program or database workers.
      - name: Run database-free read API contract tests
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/HealthMonitor.IntegrationTests/HealthMonitor.IntegrationTests.csproj \
            --configuration Release --no-build --no-restore \
            --blame-hang-timeout 3m --blame-hang-dump-type none \
            --filter "FullyQualifiedName~HealthMonitor.IntegrationTests.Api.ReadApiContractTests" \
            --logger "trx;LogFileName=read-contract.trx" \
            --results-directory artifacts/test-results/read-contract

      - name: Verify database-free read API contract execution
        shell: pwsh
        run: ./scripts/Verify-IntegrationTestResults.ps1 -Path artifacts/test-results/read-contract/read-contract.trx -Group Contract

      - name: Run database-free simulation API contract tests
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/HealthMonitor.IntegrationTests/HealthMonitor.IntegrationTests.csproj \
            --configuration Release --no-build --no-restore \
            --blame-hang-timeout 3m --blame-hang-dump-type none \
            --filter "FullyQualifiedName~HealthMonitor.IntegrationTests.Api.SimulationApiContractTests" \
            --logger "trx;LogFileName=simulation-contract.trx" \
            --results-directory artifacts/test-results/simulation-contract

      - name: Verify database-free simulation API contract execution
        shell: pwsh
        run: ./scripts/Verify-IntegrationTestResults.ps1 -Path artifacts/test-results/simulation-contract/simulation-contract.trx -Group SimulationContract

      # Real ephemeral Kestrel binding tests use fake Application ports and no database or application startup settings.
      - name: Run database-free effective simulation host tests
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/HealthMonitor.IntegrationTests/HealthMonitor.IntegrationTests.csproj \
            --configuration Release --no-build --no-restore \
            --blame-hang-timeout 3m --blame-hang-dump-type none \
            --filter "FullyQualifiedName~HealthMonitor.IntegrationTests.Api.SimulationEffectiveHostTests" \
            --logger "trx;LogFileName=simulation-host.trx" \
            --results-directory artifacts/test-results/simulation-host

      - name: Verify effective simulation host execution
        shell: pwsh
        run: ./scripts/Verify-IntegrationTestResults.ps1 -Path artifacts/test-results/simulation-host/simulation-host.trx -Group SimulationHost

      # Fake-provider AI HTTP contracts activate only the controller in an isolated host; production stays disabled.
      - name: Run database-free AI query HTTP contract tests
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/HealthMonitor.IntegrationTests/HealthMonitor.IntegrationTests.csproj \
            --configuration Release --no-build --no-restore \
            --blame-hang-timeout 3m --blame-hang-dump-type none \
            --filter "FullyQualifiedName~HealthMonitor.IntegrationTests.Api.AiQueryContractTests" \
            --logger "trx;LogFileName=ai-contract.trx" \
            --results-directory artifacts/test-results/ai-contract

      - name: Verify AI query HTTP contract execution
        shell: pwsh
        run: ./scripts/Verify-IntegrationTestResults.ps1 -Path artifacts/test-results/ai-contract/ai-contract.trx -Group AiContract

      # Actual loopback sockets with production ingress components; no Program, database, or model calls.
      - name: Run database-free AI ingress effective host tests
        timeout-minutes: 5
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/HealthMonitor.IntegrationTests/HealthMonitor.IntegrationTests.csproj \
            --configuration Release --no-build --no-restore \
            --blame-hang-timeout 3m --blame-hang-dump-type none \
            --filter "FullyQualifiedName~HealthMonitor.IntegrationTests.Api.AiIngressEffectiveHostTests" \
            --logger "trx;LogFileName=ai-ingress-host.trx" \
            --results-directory artifacts/test-results/ai-ingress-host

      - name: Verify AI ingress effective host execution
        shell: pwsh
        run: ./scripts/Verify-IntegrationTestResults.ps1 -Path artifacts/test-results/ai-ingress-host/ai-ingress-host.trx -Group AiIngressHost

      - name: Restore .NET tools
        run: dotnet tool restore

      # Install the PostgreSQL client explicitly rather than
      # relying on tools that may happen to be preinstalled
      # on a particular GitHub-hosted runner image.
      #
      # The client verifies database identity, required tables,
      # and migration-history entries; EF Core owns schema migrations.
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      # Verify database identity before running migrations.
      #
      # Checking the configured connection string alone is
      # insufficient: the actual connected database must
      # also have the expected identity.
      #
      # A wrong target fails CI before any schema changes.
      - name: Verify isolated test database and migrate both schemas
        shell: bash
        env:
          PGHOST: "127.0.0.1"
          PGPORT: "5432"
          PGDATABASE: "healthmonitor_test"
          PGUSER: "healthmonitor_test_user"
          PGPASSWORD: "ci_test_password"
        run: |
          set -euo pipefail

          # Database operations must require explicit opt-in.
          if [[ "$HEALTHMONITOR_ENABLE_DB_TESTS" != "true" ]]; then
            echo "Integration database access is not enabled."
            exit 1
          fi

          # Do not accept another host, port, or database.
          # These values identify the disposable CI service.
          if [[ "$PGHOST" != "127.0.0.1" ]] ||
             [[ "$PGPORT" != "5432" ]] ||
             [[ "$PGDATABASE" != "healthmonitor_test" ]]; then
            echo "Unexpected integration database target."
            exit 1
          fi

          # Verify the real database identity after connecting.
          # -X ignores user startup configuration.
          # -A -t returns an unformatted scalar result.
          actual_db=$(psql -X -A -t \
            -c "SELECT current_database()")

          if [[ "$actual_db" != "healthmonitor_test" ]]; then
            echo "Connected to an unexpected PostgreSQL database."
            exit 1
          fi

          echo "Isolated PostgreSQL test database verified."

          # Factories use the same validated isolated-test configuration for both contexts.
          # Keep Device before Telemetry and preserve each schema's migration history.
          dotnet ef database update \
            --context DeviceDbContext \
            --project src/backend/HealthMonitor.Infrastructure/HealthMonitor.Infrastructure.csproj \
            --startup-project src/backend/HealthMonitor.Api/HealthMonitor.Api.csproj \
            --connection "$ConnectionStrings__HealthMonitorIntegrationTest"

          dotnet ef database update \
            --context TelemetryDbContext \
            --project src/backend/HealthMonitor.Infrastructure/HealthMonitor.Infrastructure.csproj \
            --startup-project src/backend/HealthMonitor.Api/HealthMonitor.Api.csproj \
            --connection "$ConnectionStrings__HealthMonitorIntegrationTest"

          # Missing objects or migration entries must stop the job before test execution.
          psql -X --set=ON_ERROR_STOP=on <<'SQL'
          DO $verify$
          DECLARE required_table text;
          BEGIN
            FOREACH required_table IN ARRAY ARRAY[
              'device.monitored_devices', 'device.__ef_migrations_history',
              'telemetry.telemetry_pings', 'telemetry.incident_logs',
              'telemetry.device_telemetry_state', 'telemetry.simulation_batches',
              'telemetry.__ef_migrations_history']
            LOOP
              IF to_regclass(required_table) IS NULL THEN
                RAISE EXCEPTION 'Required test table missing: %', required_table;
              END IF;
            END LOOP;
            IF (SELECT count(*) FROM device.__ef_migrations_history
                WHERE "MigrationId" IN ('20261014182737_InitialDeviceSchema',
                  '20261014220912_AlignDeviceSchema')) <> 2 THEN
              RAISE EXCEPTION 'Device migration history incomplete';
            END IF;
            IF NOT EXISTS (SELECT 1 FROM telemetry.__ef_migrations_history
                WHERE "MigrationId" = '20261014230144_InitialTelemetrySchema') THEN
              RAISE EXCEPTION 'Telemetry migration history incomplete';
            END IF;
          END;
          $verify$;
          SQL

      - name: Test integration result verifier without a database
        shell: pwsh
        run: ./scripts/Test-IntegrationTestResultVerification.ps1

      # Groups are intentionally sequential: provisioning commits fixed identities,
      # while catalog boundary tests measure complete active-fleet counts.
      - name: Run SimulationBatchRepository integration tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/HealthMonitor.IntegrationTests/HealthMonitor.IntegrationTests.csproj \
            --configuration Release --no-build --no-restore \
            --filter "FullyQualifiedName~HealthMonitor.IntegrationTests.Telemetry.SimulationBatchRepositoryTests" \
            --logger "trx;LogFileName=receipts.trx" \
            --results-directory artifacts/test-results/receipts

      - name: Verify receipt test execution
        shell: pwsh
        run: ./scripts/Verify-IntegrationTestResults.ps1 -Path artifacts/test-results/receipts/receipts.trx -Group Receipts

      - name: Run DeviceCatalogQueries integration tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/HealthMonitor.IntegrationTests/HealthMonitor.IntegrationTests.csproj \
            --configuration Release --no-build --no-restore \
            --filter "FullyQualifiedName~HealthMonitor.IntegrationTests.Device.DeviceCatalogQueriesTests" \
            --logger "trx;LogFileName=catalog.trx" \
            --results-directory artifacts/test-results/catalog

      - name: Verify catalog test execution
        shell: pwsh
        run: ./scripts/Verify-IntegrationTestResults.ps1 -Path artifacts/test-results/catalog/catalog.trx -Group Catalog

      - name: Run DeviceCatalogProvisioner integration tests
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/HealthMonitor.IntegrationTests/HealthMonitor.IntegrationTests.csproj \
            --configuration Release --no-build --no-restore \
            --blame-hang-timeout 3m --blame-hang-dump-type none \
            --filter "FullyQualifiedName~HealthMonitor.IntegrationTests.Provisioning.DeviceCatalogProvisionerTests" \
            --logger "trx;LogFileName=provisioning.trx" \
            --results-directory artifacts/test-results/provisioning

      - name: Verify provisioning test execution
        shell: pwsh
        run: ./scripts/Verify-IntegrationTestResults.ps1 -Path artifacts/test-results/provisioning/provisioning.trx -Group Provisioning

      # Ingestion groups share the fixed advisory lock and run sequentially in this job's
      # already verified disposable service. Hang detection must never enable unsafe cleanup.
      - name: Run atomic ingestion integration tests
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/HealthMonitor.IntegrationTests/HealthMonitor.IntegrationTests.csproj \
            --configuration Release --no-build --no-restore \
            --blame-hang-timeout 3m --blame-hang-dump-type none \
            --filter "FullyQualifiedName~HealthMonitor.IntegrationTests.Telemetry.TelemetryIngestionTransactionTests" \
            --logger "trx;LogFileName=ingestion.trx" \
            --results-directory artifacts/test-results/ingestion

      - name: Verify ingestion test execution
        shell: pwsh
        run: ./scripts/Verify-IntegrationTestResults.ps1 -Path artifacts/test-results/ingestion/ingestion.trx -Group Ingestion

      - name: Run ingestion lock integration tests
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/HealthMonitor.IntegrationTests/HealthMonitor.IntegrationTests.csproj \
            --configuration Release --no-build --no-restore \
            --blame-hang-timeout 3m --blame-hang-dump-type none \
            --filter "FullyQualifiedName~HealthMonitor.IntegrationTests.Telemetry.TelemetryIngestionLockTests" \
            --logger "trx;LogFileName=ingestion-locks.trx" \
            --results-directory artifacts/test-results/ingestion-locks

      - name: Verify ingestion lock test execution
        shell: pwsh
        run: ./scripts/Verify-IntegrationTestResults.ps1 -Path artifacts/test-results/ingestion-locks/ingestion-locks.trx -Group Locks

      # Expanded concurrency is a separate exact inventory; independent pools still target
      # only this job's verified disposable database, never multiple test processes.
      - name: Run expanded ingestion concurrency tests
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/HealthMonitor.IntegrationTests/HealthMonitor.IntegrationTests.csproj \
            --configuration Release --no-build --no-restore \
            --blame-hang-timeout 3m --blame-hang-dump-type none \
            --filter "FullyQualifiedName~HealthMonitor.IntegrationTests.Telemetry.TelemetryIngestionConcurrencyTests" \
            --logger "trx;LogFileName=ingestion-concurrency.trx" \
            --results-directory artifacts/test-results/ingestion-concurrency

      - name: Verify expanded ingestion concurrency execution
        shell: pwsh
        run: ./scripts/Verify-IntegrationTestResults.ps1 -Path artifacts/test-results/ingestion-concurrency/ingestion-concurrency.trx -Group Concurrency

      # Retention performs global pruning and must refuse nonempty Telemetry baselines.
      # Run only after prior serialized groups have removed their owned test data.
      - name: Run retention integration tests
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/HealthMonitor.IntegrationTests/HealthMonitor.IntegrationTests.csproj \
            --configuration Release --no-build --no-restore \
            --blame-hang-timeout 3m --blame-hang-dump-type none \
            --filter "FullyQualifiedName~HealthMonitor.IntegrationTests.Telemetry.TelemetryRetentionStoreTests" \
            --logger "trx;LogFileName=retention.trx" \
            --results-directory artifacts/test-results/retention

      - name: Verify retention test execution
        shell: pwsh
        run: ./scripts/Verify-IntegrationTestResults.ps1 -Path artifacts/test-results/retention/retention.trx -Group Retention

      - name: Run latest-state health query integration tests
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/HealthMonitor.IntegrationTests/HealthMonitor.IntegrationTests.csproj \
            --configuration Release --no-build --no-restore \
            --blame-hang-timeout 3m --blame-hang-dump-type none \
            --filter "FullyQualifiedName~HealthMonitor.IntegrationTests.Telemetry.DeviceHealthQueriesTests" \
            --logger "trx;LogFileName=health-queries.trx" \
            --results-directory artifacts/test-results/health-queries

      - name: Verify latest-state health query execution
        shell: pwsh
        run: ./scripts/Verify-IntegrationTestResults.ps1 -Path artifacts/test-results/health-queries/health-queries.trx -Group HealthQueries

      # History count/page snapshots execute sequentially on the same verified disposable target.
      - name: Run device history integration tests
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/HealthMonitor.IntegrationTests/HealthMonitor.IntegrationTests.csproj \
            --configuration Release --no-build --no-restore \
            --blame-hang-timeout 3m --blame-hang-dump-type none \
            --filter "FullyQualifiedName~HealthMonitor.IntegrationTests.Telemetry.DeviceHistoryQueriesTests" \
            --logger "trx;LogFileName=history.trx" \
            --results-directory artifacts/test-results/history

      - name: Verify device history test execution
        shell: pwsh
        run: ./scripts/Verify-IntegrationTestResults.ps1 -Path artifacts/test-results/history/history.trx -Group History

      - name: Run PostgreSQL read API integration tests
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/HealthMonitor.IntegrationTests/HealthMonitor.IntegrationTests.csproj \
            --configuration Release --no-build --no-restore \
            --blame-hang-timeout 3m --blame-hang-dump-type none \
            --filter "FullyQualifiedName~HealthMonitor.IntegrationTests.Api.ReadApiDatabaseTests" \
            --logger "trx;LogFileName=read-api.trx" \
            --results-directory artifacts/test-results/read-api

      - name: Verify PostgreSQL read API execution
        shell: pwsh
        run: ./scripts/Verify-IntegrationTestResults.ps1 -Path artifacts/test-results/read-api/read-api.trx -Group ReadApi

      # Simulation writes share the same exclusive, verified disposable target and existing ownership-aware cleanup.
      - name: Run PostgreSQL simulation API integration tests
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          dotnet test tests/HealthMonitor.IntegrationTests/HealthMonitor.IntegrationTests.csproj \
            --configuration Release --no-build --no-restore \
            --blame-hang-timeout 3m --blame-hang-dump-type none \
            --filter "FullyQualifiedName~HealthMonitor.IntegrationTests.Api.SimulationApiDatabaseTests" \
            --logger "trx;LogFileName=simulation-api.trx" \
            --results-directory artifacts/test-results/simulation-api

      - name: Verify PostgreSQL simulation API execution
        shell: pwsh
        run: ./scripts/Verify-IntegrationTestResults.ps1 -Path artifacts/test-results/simulation-api/simulation-api.trx -Group SimulationDatabase

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend/health-monitor-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/frontend/health-monitor-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
